[workspace]
authors = ["AndreaFrederica <andreafrederica@outlook.com>"]
channels = ["conda-forge"]
name = "andrea-novel-helper"
platforms = ["win-64","linux-64", "osx-64", "osx-arm64","linux-aarch64"]
version = "0.1.0"

[tasks]
server = { cmd = [
    "python",
    "static_server.py",
    "--dir",
    "./packages/webview/dist/spa",
    "--port",
    "5173",
] }

build = { cmd = ["npm", "run", "compile"] }

build_web = { cmd = ["npm", "run", "build:webview"] }

build_all = { depends-on = ["build_enigo", "build_web", "build"] }

web_dev = { cmd = ["npm", "run", "dev:webview"] }

publish = { cmd = ["npx", "vsce", "publish"] }

publish_ovsx = { cmd = ["npx", "ovsx", "publish"] }

publish_all = { depends-on = ["publish", "publish_ovsx"] }

local_std = { cmd = ["node", "scripts/pixi-local-build.js", "std"], env = { ELECTRON_VERSION = "30.0.9" } }
local_exp = { cmd = ["node", "scripts/pixi-local-build.js", "exp"], env = { ELECTRON_VERSION = "30.0.9" } }
local_both = { depends-on = ["local_std", "local_exp"] }


# Build enigo-keyboard native module
build_enigo = { cmd = "npm run build:ci", cwd = "packages/enigo-keyboard" }
build_enigo_debug = { cmd = "npm run build:debug", cwd = "packages/enigo-keyboard" }
test_enigo = { cmd = "npm test", cwd = "packages/enigo-keyboard" }
clean_enigo = { cmd = "cargo clean", cwd = "packages/enigo-keyboard" }

# Combined build tasks
build_with_enigo = { depends-on = ["build", "build_enigo"] }
build_all_with_enigo = { depends-on = ["build_all", "build_enigo"] }


[dependencies]
python = ">=3.13.5,<3.14"
rust = ">=1.91.1,<1.92"
nodejs = "22.*"

