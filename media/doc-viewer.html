<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline' __CSP_SOURCE__; script-src __CSP_SOURCE__ 'nonce-__NONCE__'; img-src __CSP_SOURCE__ https: data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANH 文档</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            color: var(--vscode-editor-foreground);
            background: var(--vscode-editor-background);
            font-family: var(--vscode-font-family);
            font-size: var(--vscode-font-size);
            line-height: 1.6;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Sidebar ──────────────────────────────────── */
        .sidebar {
            width: 240px;
            min-width: 200px;
            border-right: 1px solid var(--vscode-panel-border);
            background: var(--vscode-sideBar-background);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--vscode-panel-border);
        }

        .sidebar-header h1 {
            font-size: 14px;
            font-weight: 600;
            color: var(--vscode-sideBarTitle-foreground);
        }

        .sidebar-search {
            padding: 8px 12px;
            border-bottom: 1px solid var(--vscode-panel-border);
        }

        .sidebar-search input {
            width: 100%;
            border: 1px solid var(--vscode-input-border, var(--vscode-panel-border));
            background: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border-radius: 4px;
            padding: 6px 10px;
            font: inherit;
            font-size: 13px;
        }

        .sidebar-search input:focus {
            outline: none;
            border-color: var(--vscode-focusBorder);
        }

        .sidebar-search input::placeholder {
            color: var(--vscode-input-placeholderForeground);
        }

        .nav-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .nav-category {
            margin-bottom: 4px;
        }

        .nav-category-title {
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--vscode-sideBarSectionHeader-foreground);
            background: var(--vscode-sideBarSectionHeader-background);
            letter-spacing: 0.5px;
        }

        .nav-item {
            padding: 6px 16px 6px 24px;
            font-size: 13px;
            cursor: pointer;
            border-left: 2px solid transparent;
            color: var(--vscode-sideBar-foreground);
            transition: background 0.1s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-item:hover {
            background: var(--vscode-list-hoverBackground);
        }

        .nav-item.active {
            background: var(--vscode-list-activeSelectionBackground);
            color: var(--vscode-list-activeSelectionForeground);
            border-left-color: var(--vscode-focusBorder);
        }

        .nav-item.hidden {
            display: none;
        }

        /* ── Content ──────────────────────────────────── */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 14px 24px;
            border-bottom: 1px solid var(--vscode-panel-border);
            background: var(--vscode-editor-background);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .mode-toggle {
            display: flex;
            gap: 4px;
            background: var(--vscode-input-background);
            border: 1px solid var(--vscode-panel-border);
            border-radius: 4px;
            padding: 2px;
        }

        .mode-btn {
            padding: 3px 10px;
            font-size: 12px;
            border: none;
            background: transparent;
            color: var(--vscode-foreground);
            cursor: pointer;
            border-radius: 3px;
            transition: background 0.15s ease;
        }

        .mode-btn.active {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
        }

        .content-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        /* ── Buttons ──────────────────────────────────── */
        button {
            border: 1px solid var(--vscode-panel-border);
            background: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
            border-radius: 4px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: background 0.15s ease;
        }

        button:hover {
            background: var(--vscode-button-secondaryHoverBackground);
        }

        .content-header .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            padding: 5px 12px;
        }

        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }

        .content-body h4 {
            font-size: 14px;
            font-weight: 600;
            margin: 18px 0 6px;
            color: var(--vscode-editor-foreground);
        }

        .content-body h4:first-child {
            margin-top: 0;
        }

        .content-body p {
            margin: 6px 0;
            font-size: 13px;
        }

        .content-body ul {
            margin: 6px 0 6px 20px;
            padding: 0;
            font-size: 13px;
        }

        .content-body li {
            margin: 3px 0;
        }

        .content-body code {
            font-family: var(--vscode-editor-font-family);
            background: var(--vscode-textBlockQuote-background);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 12px;
        }

        .content-body pre {
            margin: 8px 0;
            padding: 12px;
            border-radius: 4px;
            background: var(--vscode-textBlockQuote-background);
            border: 1px solid var(--vscode-panel-border);
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.5;
        }

        .content-body pre code {
            background: transparent;
            padding: 0;
            border-radius: 0;
            font-size: inherit;
        }

        .content-body ol {
            margin: 6px 0 6px 20px;
            padding: 0;
            font-size: 13px;
        }

        .content-body ol li {
            margin: 3px 0;
        }

        .content-body .content-body pre {
            margin: 8px 0;
        }

        .content-body kbd {
            display: inline-block;
            padding: 1px 5px;
            font-size: 11px;
            font-family: var(--vscode-font-family);
            background: var(--vscode-editor-background);
            border: 1px solid var(--vscode-panel-border);
            border-radius: 3px;
            color: var(--vscode-descriptionForeground);
        }

        .doc-note {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 4px;
            background: color-mix(in srgb, var(--vscode-textLink-foreground) 8%, transparent);
            border-left: 3px solid var(--vscode-textLink-foreground);
            font-size: 12px;
        }

        /* ── Mode Switching ───────────────────────────── */
        .doc-section { display: block; }

        .content-body.mode-beginner .doc-section.pro {
            display: none;
        }

        .content-body.mode-pro .doc-section.beginner {
            display: none;
        }

        .content-body.mode-beginner h4.pro-only {
            display: none;
        }

        .content-body.mode-pro h4.beginner-only {
            display: none;
        }

        /* ── Empty State ──────────────────────────────── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--vscode-descriptionForeground);
            font-size: 14px;
        }

        /* ── Responsive ───────────────────────────────── */
        @media (max-width: 640px) {
            .sidebar {
                width: 180px;
                min-width: 160px;
            }

            .content-body {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>ANH 文档中心</h1>
        </div>
        <div class="sidebar-search">
            <input id="search" type="text" placeholder="搜索文档...">
        </div>
        <nav class="nav-tree" id="navTree"></nav>
    </aside>

    <main class="content">
        <div class="content-header">
            <h2 id="docTitle">选择一个文档</h2>
            <div style="display:flex;align-items:center;gap:12px;">
                <div class="mode-toggle" id="modeToggle">
                    <button class="mode-btn active" data-mode="beginner">小白模式</button>
                    <button class="mode-btn" data-mode="pro">专业模式</button>
                </div>
                <button class="back-btn" id="releaseDocsBtn" style="display:none;">释放到项目</button>
                <button class="back-btn" id="backBtn" style="display:none;">返回引导</button>
            </div>
        </div>
        <div class="content-body mode-beginner" id="docContent">
            <div class="empty-state">在左侧选择一个文档以查看详情</div>
        </div>
    </main>

    <script nonce="__NONCE__" src="__SCRIPT_URI__"></script>
</body>

</html>
