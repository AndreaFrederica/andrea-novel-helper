<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline' __CSP_SOURCE__; script-src __CSP_SOURCE__ 'nonce-__NONCE__'; img-src __CSP_SOURCE__ https: data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANH 文档</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            color: var(--vscode-editor-foreground);
            background: var(--vscode-editor-background);
            font-family: var(--vscode-font-family);
            font-size: var(--vscode-font-size);
            line-height: 1.6;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Sidebar ──────────────────────────────────── */
        .sidebar {
            width: 240px;
            min-width: 200px;
            border-right: 1px solid var(--vscode-panel-border);
            background: var(--vscode-sideBar-background);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--vscode-panel-border);
        }

        .sidebar-header h1 {
            font-size: 14px;
            font-weight: 600;
            color: var(--vscode-sideBarTitle-foreground);
        }

        .sidebar-search {
            padding: 8px 12px;
            border-bottom: 1px solid var(--vscode-panel-border);
        }

        .sidebar-search input {
            width: 100%;
            border: 1px solid var(--vscode-input-border, var(--vscode-panel-border));
            background: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border-radius: 4px;
            padding: 6px 10px;
            font: inherit;
            font-size: 13px;
        }

        .sidebar-search input:focus {
            outline: none;
            border-color: var(--vscode-focusBorder);
        }

        .sidebar-search input::placeholder {
            color: var(--vscode-input-placeholderForeground);
        }

        .nav-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .nav-category {
            margin-bottom: 4px;
        }

        .nav-category-title {
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--vscode-sideBarSectionHeader-foreground);
            background: var(--vscode-sideBarSectionHeader-background);
            letter-spacing: 0.5px;
        }

        .nav-item {
            padding: 6px 16px 6px 24px;
            font-size: 13px;
            cursor: pointer;
            border-left: 2px solid transparent;
            color: var(--vscode-sideBar-foreground);
            transition: background 0.1s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-item:hover {
            background: var(--vscode-list-hoverBackground);
        }

        .nav-item.active {
            background: var(--vscode-list-activeSelectionBackground);
            color: var(--vscode-list-activeSelectionForeground);
            border-left-color: var(--vscode-focusBorder);
        }

        .nav-item.hidden {
            display: none;
        }

        /* ── Content ──────────────────────────────────── */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 14px 24px;
            border-bottom: 1px solid var(--vscode-panel-border);
            background: var(--vscode-editor-background);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .mode-toggle {
            display: flex;
            gap: 4px;
            background: var(--vscode-input-background);
            border: 1px solid var(--vscode-panel-border);
            border-radius: 4px;
            padding: 2px;
        }

        .mode-btn {
            padding: 3px 10px;
            font-size: 12px;
            border: none;
            background: transparent;
            color: var(--vscode-foreground);
            cursor: pointer;
            border-radius: 3px;
            transition: background 0.15s ease;
        }

        .mode-btn.active {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
        }

        .content-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        /* ── Buttons ──────────────────────────────────── */
        button {
            border: 1px solid var(--vscode-panel-border);
            background: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
            border-radius: 4px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: background 0.15s ease;
        }

        button:hover {
            background: var(--vscode-button-secondaryHoverBackground);
        }

        .content-header .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            padding: 5px 12px;
        }

        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }

        .content-body h4 {
            font-size: 14px;
            font-weight: 600;
            margin: 18px 0 6px;
            color: var(--vscode-editor-foreground);
        }

        .content-body h4:first-child {
            margin-top: 0;
        }

        .content-body p {
            margin: 6px 0;
            font-size: 13px;
        }

        .content-body ul {
            margin: 6px 0 6px 20px;
            padding: 0;
            font-size: 13px;
        }

        .content-body li {
            margin: 3px 0;
        }

        .content-body code {
            font-family: var(--vscode-editor-font-family);
            color: var(--vscode-textPreformat-foreground, var(--vscode-editor-foreground));
            background: var(--vscode-textCodeBlock-background, var(--vscode-textBlockQuote-background));
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 12px;
        }

        .content-body pre {
            margin: 8px 0;
            padding: 12px;
            border-radius: 4px;
            color: var(--vscode-textPreformat-foreground, var(--vscode-editor-foreground));
            background: var(--vscode-textCodeBlock-background, var(--vscode-textBlockQuote-background));
            border: 1px solid var(--vscode-panel-border);
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.5;
        }

        .content-body pre code {
            background: transparent;
            padding: 0;
            border-radius: 0;
            font-size: inherit;
        }

        .content-body ol {
            margin: 6px 0 6px 20px;
            padding: 0;
            font-size: 13px;
        }

        .content-body ol li {
            margin: 3px 0;
        }

        .content-body .doc-table {
            width: 100%;
            margin: 8px 0;
            border-collapse: collapse;
            font-size: 13px;
        }

        .content-body .doc-table tr {
            border-bottom: 1px solid var(--vscode-panel-border);
        }

        .content-body .doc-table th,
        .content-body .doc-table td {
            padding: 6px 8px;
            text-align: left;
            vertical-align: top;
        }

        .content-body .doc-table th {
            font-weight: 600;
        }

        .content-body .content-body pre {
            margin: 8px 0;
        }

        .content-body kbd {
            display: inline-block;
            padding: 1px 5px;
            font-size: 11px;
            font-family: var(--vscode-font-family);
            background: var(--vscode-editor-background);
            border: 1px solid var(--vscode-panel-border);
            border-radius: 3px;
            color: var(--vscode-descriptionForeground);
        }

        .doc-note {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 4px;
            background: color-mix(in srgb, var(--vscode-textLink-foreground) 8%, transparent);
            border-left: 3px solid var(--vscode-textLink-foreground);
            font-size: 12px;
        }

        .doc-ref-link {
            color: var(--vscode-textLink-foreground);
            text-decoration: underline;
            cursor: pointer;
        }

        .doc-ref-link:hover {
            filter: brightness(1.2);
        }

        /* ── Completion Demo ─────────────────────────── */
        .completion-demo {
            margin: 10px 0;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--vscode-panel-border);
        }

        .demo-chrome {
            background: var(--vscode-editorGroupHeader-tabsBackground, #252526);
            padding: 0 8px;
            border-bottom: 1px solid var(--vscode-panel-border);
            height: 30px;
            display: flex;
            align-items: center;
        }

        .demo-tab {
            font-size: 12px;
            padding: 4px 12px;
            color: var(--vscode-foreground);
            background: var(--vscode-editor-background);
            border-top: 2px solid var(--vscode-focusBorder);
            height: 100%;
            display: flex;
            align-items: center;
        }

        .demo-editor {
            position: relative;
            background: var(--vscode-editor-background);
            padding: 8px 12px;
            min-height: 56px;
            font-family: var(--vscode-editor-font-family, monospace);
            font-size: 14px;
            line-height: 22px;
        }

        .demo-line {
            display: flex;
            align-items: baseline;
        }

        .demo-gutter {
            width: 36px;
            text-align: right;
            padding-right: 12px;
            color: var(--vscode-editorLineNumber-foreground, #858585);
            user-select: none;
            flex-shrink: 0;
        }

        .demo-code {
            color: var(--vscode-editor-foreground);
            white-space: pre;
        }

        .demo-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: var(--vscode-editor-foreground);
            vertical-align: text-bottom;
            animation: demo-blink 1s step-end infinite;
        }

        @keyframes demo-blink {
            50% { opacity: 0; }
        }

        .demo-suggest {
            display: none;
            position: absolute;
            left: 48px;
            top: 36px;
            background: var(--vscode-editorSuggestWidget-background, #252526);
            border: 1px solid var(--vscode-editorSuggestWidget-border, #454545);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
            min-width: 240px;
            max-width: 340px;
            z-index: 10;
            font-size: 13px;
            border-radius: 4px;
            overflow: hidden;
        }

        .demo-suggest-item {
            display: flex;
            align-items: center;
            padding: 2px 8px;
            gap: 6px;
            line-height: 20px;
        }

        .demo-suggest-item.selected {
            background: var(--vscode-editorSuggestWidget-selectedBackground, #094771);
        }

        .demo-suggest-label {
            flex: 1;
            color: var(--vscode-editor-foreground);
            white-space: nowrap;
        }

        .demo-suggest-detail {
            color: var(--vscode-descriptionForeground, #999);
            font-size: 12px;
            white-space: nowrap;
            margin-left: auto;
        }

        .demo-status {
            padding: 6px 12px;
            font-size: 12px;
            color: var(--vscode-descriptionForeground);
            border-top: 1px solid var(--vscode-panel-border);
            text-align: center;
            background: var(--vscode-editor-background);
        }

        .demo-mode-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-bottom: 1px solid var(--vscode-panel-border);
            background: var(--vscode-editor-background);
        }

        .demo-mode-label {
            font-size: 11px;
            color: var(--vscode-descriptionForeground);
            margin-right: 4px;
            white-space: nowrap;
        }

        .demo-mode-btn {
            padding: 2px 8px;
            font-size: 11px;
            font-family: var(--vscode-editor-font-family, monospace);
            border: 1px solid var(--vscode-panel-border);
            background: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .demo-mode-btn:hover {
            background: var(--vscode-button-secondaryHoverBackground);
        }

        .demo-mode-btn.active {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border-color: var(--vscode-button-background);
        }

        /* ── Mode Switching ───────────────────────────── */
        .doc-section { display: block; }

        .content-body.mode-beginner .doc-section.pro {
            display: none;
        }

        .content-body.mode-pro .doc-section.beginner {
            display: none;
        }

        .content-body.mode-beginner h4.pro-only {
            display: none;
        }

        .content-body.mode-pro h4.beginner-only {
            display: none;
        }

        /* ── Syntax Highlighting ───────────────────────── */
        :root {
            --sh-keyword: var(--vscode-symbolIcon-keywordForeground, #569cd6);
            --sh-string: var(--vscode-symbolIcon-stringForeground, #ce9178);
            --sh-number: var(--vscode-symbolIcon-numberForeground, #b5cea8);
            --sh-comment: var(--vscode-descriptionForeground, #6a9955);
            --sh-type: var(--vscode-symbolIcon-classForeground, #4ec9b0);
            --sh-function: var(--vscode-symbolIcon-functionForeground, #dcdcaa);
            --sh-variable: var(--vscode-symbolIcon-variableForeground, #9cdcfe);
            --sh-constant: var(--vscode-symbolIcon-constantForeground, #4fc1ff);
            --sh-punctuation: var(--vscode-editor-foreground, #d4d4d4);
            --sh-bracket: var(--vscode-symbolIcon-operatorForeground, #ffd700);
            --sh-separator: var(--vscode-descriptionForeground, #808080);
            --sh-tag: var(--vscode-symbolIcon-keywordForeground, #569cd6);
            --sh-attribute: var(--vscode-symbolIcon-propertyForeground, #9cdcfe);
            --sh-operator: var(--vscode-symbolIcon-operatorForeground, #d4d4d4);
            --sh-regexp: var(--vscode-symbolIcon-colorForeground, #d16969);
            --sh-md-heading: var(--vscode-textLink-foreground, #569cd6);
            --sh-md-heading2: var(--vscode-textLink-foreground, #569cd6);
            --sh-md-heading3: var(--vscode-textLink-foreground, #569cd6);
            --sh-md-heading4: var(--vscode-textLink-foreground, #569cd6);
            --sh-md-bold: var(--vscode-editor-foreground, #d4d4d4);
            --sh-md-italic: var(--vscode-editor-foreground, #d4d4d4);
            --sh-md-strike: var(--vscode-descriptionForeground, #808080);
            --sh-md-list: var(--vscode-descriptionForeground, #808080);
            --sh-md-link: var(--vscode-textLink-foreground, #4ec9b0);
            --sh-md-code: var(--vscode-textPreformat-foreground, #ce9178);
            --sh-md-sep: var(--vscode-descriptionForeground, #808080);
            --sh-role-field: var(--vscode-symbolIcon-keyForeground, #c586c0);
            --sh-role-value: var(--vscode-textPreformat-foreground, var(--vscode-editor-foreground, #d4d4d4));
            --sh-prose-dialogue-double: var(--vscode-terminal-ansiYellow, #fbdc98ff);
            --sh-prose-dialogue-corner: var(--vscode-terminal-ansiYellow, #fbdc98ff);
            --sh-prose-thought-single: var(--vscode-terminal-ansiBlue, #98bbfbff);
            --sh-prose-book-title: var(--vscode-terminal-ansiMagenta, #fbbc98ff);
        }
        .content-body pre {
            position: relative;
        }

        .content-body pre code {
            display: block;
            white-space: pre;
        }

        .sh-key { color: var(--sh-variable); }
        .sh-str { color: var(--sh-string); }
        .sh-num { color: var(--sh-number); }
        .sh-bool { color: var(--sh-keyword); }
        .sh-null { color: var(--sh-keyword); }
        .sh-comment { color: var(--sh-comment); }
        .sh-bracket { color: var(--sh-bracket); }
        .sh-colon { color: var(--sh-punctuation); }
        .sh-comma { color: var(--sh-punctuation); }
        .sh-punct { color: var(--sh-separator); }

        .sh-md-h1 { color: var(--sh-md-heading); font-weight: bold; }
        .sh-md-h2 { color: var(--sh-md-heading2); font-weight: bold; }
        .sh-md-h3 { color: var(--sh-md-heading3); font-weight: bold; }
        .sh-md-h4 { color: var(--sh-md-heading4); }
        .sh-md-bold { color: var(--sh-md-bold); font-weight: bold; }
        .sh-md-italic { color: var(--sh-md-italic); font-style: italic; }
        .sh-md-strike { color: var(--sh-md-strike); text-decoration: line-through; }
        .sh-md-list { color: var(--sh-md-list); }
        .sh-md-link { color: var(--sh-md-link); }
        .sh-md-link-text { color: var(--sh-md-link); }
        .sh-md-code { color: var(--sh-md-code); }
        .sh-md-sep { color: var(--sh-md-sep); }
        .sh-md-marker { color: var(--sh-md-sep); }
        .sh-md-quote { color: var(--sh-md-sep); }
        .sh-md-meta { color: var(--sh-keyword); }
        .sh-md-url { color: var(--sh-string); }
        .sh-md-table-pipe { color: var(--sh-md-sep); }
        .sh-md-plain { color: inherit; }

        .sh-toml-section { color: var(--sh-keyword); font-weight: bold; }
        .sh-toml-key { color: var(--sh-variable); }
        .sh-toml-eq { color: var(--sh-punctuation); }
        .sh-toml-str { color: var(--sh-string); }
        .sh-toml-num { color: var(--sh-number); }
        .sh-toml-bool { color: var(--sh-keyword); }
        .sh-toml-comment { color: var(--sh-comment); }
        .sh-toml-bracket { color: var(--sh-bracket); }

        .sh-csv-header { color: var(--sh-variable); font-weight: bold; }
        .sh-csv-sep { color: var(--sh-separator); }
        .sh-csv-str { color: var(--sh-string); }

        .sh-js-kw { color: var(--sh-keyword); }
        .sh-js-str { color: var(--sh-string); }
        .sh-js-func { color: var(--sh-function); }
        .sh-js-num { color: var(--sh-number); }
        .sh-js-comment { color: var(--sh-comment); }
        .sh-js-punct { color: var(--sh-punctuation); }
        .sh-js-const { color: var(--sh-constant); }
        .sh-js-prop { color: var(--sh-variable); }

        .sh-role-name,
        .sh-prose-role {
            font-weight: bold;
            cursor: pointer;
            border-bottom: 1px dotted currentColor;
        }

        .sh-role-name:hover,
        .sh-prose-role:hover {
            filter: brightness(1.3);
        }

        .sh-role-field { color: var(--sh-role-field); font-weight: bold; }
        .sh-role-value { color: var(--sh-role-value); }

        .role-tooltip {
            font-family: var(--vscode-font-family);
            line-height: 1.5;
        }

        /* ── Empty State ──────────────────────────────── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--vscode-descriptionForeground);
            font-size: 14px;
        }

        /* ── Responsive ───────────────────────────────── */
        @media (max-width: 640px) {
            .sidebar {
                width: 180px;
                min-width: 160px;
            }

            .content-body {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>ANH 文档中心</h1>
        </div>
        <div class="sidebar-search">
            <input id="search" type="text" placeholder="搜索文档...">
        </div>
        <nav class="nav-tree" id="navTree"></nav>
    </aside>

    <main class="content">
        <div class="content-header">
            <h2 id="docTitle">选择一个文档</h2>
            <div style="display:flex;align-items:center;gap:12px;">
                <div class="mode-toggle" id="modeToggle">
                    <button class="mode-btn active" data-mode="beginner">小白模式</button>
                    <button class="mode-btn" data-mode="pro">专业模式</button>
                </div>
                <button class="back-btn" id="releaseDocsBtn" style="display:none;">释放到项目</button>
                <button class="back-btn" id="backBtn" style="display:none;">返回引导</button>
            </div>
        </div>
        <div class="content-body mode-beginner" id="docContent">
            <div class="empty-state">在左侧选择一个文档以查看详情</div>
        </div>
    </main>

    <script nonce="__NONCE__" src="__SCRIPT_URI__"></script>
</body>

</html>
