<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src __CSP_SOURCE__ 'unsafe-inline'; script-src 'nonce-__NONCE__';">
<title>批量导出</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: var(--vscode-font-family);
    color: var(--vscode-foreground);
    background: var(--vscode-sideBar-background);
    padding: 16px;
    font-size: 13px;
}
h2 { font-size: 16px; margin-bottom: 12px; font-weight: 600; }
.toolbar {
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 12px; flex-wrap: wrap;
}
.toolbar label { font-size: 12px; opacity: 0.8; }
.toolbar select, .toolbar input {
    background: var(--vscode-input-background);
    color: var(--vscode-input-foreground);
    border: 1px solid var(--vscode-input-border, transparent);
    padding: 4px 8px; border-radius: 3px; font-size: 12px;
}
.toolbar input[type="text"] { flex: 1; min-width: 120px; }
.btn {
    background: var(--vscode-button-background);
    color: var(--vscode-button-foreground);
    border: none; padding: 6px 14px; border-radius: 3px;
    cursor: pointer; font-size: 12px; white-space: nowrap;
}
.btn:hover { background: var(--vscode-button-hoverBackground); }
.btn.secondary {
    background: var(--vscode-button-secondaryBackground);
    color: var(--vscode-button-secondaryForeground);
}
.btn.secondary:hover { background: var(--vscode-button-secondaryHoverBackground); }
.tree-container {
    border: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.3));
    border-radius: 4px; padding: 8px;
    max-height: calc(100vh - 240px); overflow-y: auto;
    margin-bottom: 12px;
}
.tree-item {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 0; cursor: default;
    white-space: nowrap;
}
.tree-item:hover { background: var(--vscode-list-hoverBackground); }
.tree-toggle {
    width: 16px; height: 16px; display: inline-flex;
    align-items: center; justify-content: center;
    cursor: pointer; user-select: none; flex-shrink: 0;
    font-size: 10px; opacity: 0.7;
}
.tree-toggle:hover { opacity: 1; }
.tree-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.8; }
.tree-label { font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.tree-children { padding-left: 16px; }
input[type="checkbox"] { cursor: pointer; flex-shrink: 0; }
.select-actions { display: flex; gap: 6px; margin-bottom: 8px; }
.select-actions button {
    background: none; border: none; color: var(--vscode-textLink-foreground);
    cursor: pointer; font-size: 12px; padding: 2px 4px;
}
.select-actions button:hover { text-decoration: underline; }
.status { font-size: 12px; opacity: 0.7; margin-bottom: 8px; }
.output-row {
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 12px;
}
.output-row input[type="text"] {
    flex: 1; background: var(--vscode-input-background);
    color: var(--vscode-input-foreground);
    border: 1px solid var(--vscode-input-border, transparent);
    padding: 4px 8px; border-radius: 3px; font-size: 12px;
}
.export-bar { display: flex; gap: 8px; align-items: center; }
.export-bar .selected-count { font-size: 12px; opacity: 0.8; }
</style>
</head>
<body>
<h2>批量导出</h2>
<div class="toolbar">
    <label>格式:</label>
    <select id="format">
        <option value="txt" selected>纯文本 (TXT)</option>
        <option value="pdf">PDF</option>
        <option value="png">PNG</option>
        <option value="svg">SVG</option>
        <option value="html">HTML</option>
    </select>
    <label id="templateLabel">模板:</label>
    <select id="template"><option value="sample">sample</option></select>
</div>
<div class="output-row">
    <label>输出目录:</label>
    <input type="text" id="outputDir" placeholder="点击"浏览"选择导出目录" readonly>
    <button class="btn secondary" id="btnPickDir">浏览...</button>
</div>
<div class="toolbar" style="margin-bottom:8px;">
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
        <input type="checkbox" id="keepStructure" checked> 保留目录结构
    </label>
</div>
<div class="select-actions">
    <button id="btnSelectAll">全选</button>
    <button id="btnDeselectAll">取消全选</button>
    <button id="btnCollapseAll">全部折叠</button>
    <button id="btnExpandAll">全部展开</button>
</div>
<div class="status" id="status">正在加载文件树...</div>
<div class="tree-container" id="treeContainer"></div>
<div class="export-bar">
    <button class="btn" id="btnExport">开始批量导出</button>
    <span class="selected-count" id="selectedCount">已选 0 个文件</span>
</div>

<script nonce="__NONCE__">
(function() {
    const vscode = acquireVsCodeApi();
    let fileTree = [];
    let expandedDirs = new Set();
    let checkedPaths = new Set(); // 内存中维护的选中集合，不依赖 DOM

    // 恢复持久化状态
    const saved = vscode.getState();
    if (saved) {
        if (saved.expandedDirs) expandedDirs = new Set(saved.expandedDirs);
        if (saved.format) document.getElementById('format').value = saved.format;
        if (saved.outputDir) document.getElementById('outputDir').value = saved.outputDir;
        if (saved.keepStructure !== undefined) document.getElementById('keepStructure').checked = saved.keepStructure;
        if (saved.checkedPaths) checkedPaths = new Set(saved.checkedPaths);
    }

    function saveState() {
        vscode.setState({
            expandedDirs: [...expandedDirs],
            format: document.getElementById('format').value,
            outputDir: document.getElementById('outputDir').value,
            keepStructure: document.getElementById('keepStructure').checked,
            checkedPaths: [...checkedPaths],
        });
    }

    // 消息监听
    window.addEventListener('message', e => {
        const msg = e.data;
        switch (msg.command) {
            case 'batchExport.fileTree':
                fileTree = msg.tree;
                renderTree();
                break;
            case 'batchExport.templates': {
                const sel = document.getElementById('template');
                sel.innerHTML = '';
                for (const t of msg.templates) {
                    const opt = document.createElement('option');
                    opt.value = t; opt.textContent = t;
                    sel.appendChild(opt);
                }
                break;
            }
            case 'batchExport.dirPicked':
                document.getElementById('outputDir').value = msg.dir;
                saveState();
                break;
        }
    });

    document.getElementById('format').addEventListener('change', () => {
        const isTxt = document.getElementById('format').value === 'txt';
        document.getElementById('template').disabled = isTxt;
        document.getElementById('templateLabel').style.opacity = isTxt ? '0.4' : '';
        saveState();
    });
    // 初始化时检查
    requestAnimationFrame(() => {
        const isTxt = document.getElementById('format').value === 'txt';
        document.getElementById('template').disabled = isTxt;
        document.getElementById('templateLabel').style.opacity = isTxt ? '0.4' : '';
    });

    // 告知后端就绪
    vscode.postMessage({ command: 'batchExport.ready' });

    // 文件树渲染
    function renderTree() {
        const container = document.getElementById('treeContainer');
        container.innerHTML = '';
        if (fileTree.length === 0) {
            document.getElementById('status').textContent = '未找到 .md / .txt 文件。请确保已打开工作区。';
            return;
        }
        const totalCount = countFiles(fileTree);
        document.getElementById('status').textContent = '共 ' + totalCount + ' 个可导出文件';
        for (const node of fileTree) {
            container.appendChild(renderNode(node, 0));
        }
        updateSelectedCount();
    }

    function countFiles(nodes) {
        let count = 0;
        for (const n of nodes) {
            if (n.isDir) count += countFiles(n.children || []);
            else count++;
        }
        return count;
    }

    function renderNode(node, depth) {
        if (node.isDir) return renderDirNode(node, depth);
        return renderFileNode(node, depth);
    }

    function renderDirNode(node, depth) {
        const wrapper = document.createElement('div');
        const row = document.createElement('div');
        row.className = 'tree-item';
        row.style.paddingLeft = (depth * 16) + 'px';

        const toggle = document.createElement('span');
        toggle.className = 'tree-toggle';
        const isExpanded = expandedDirs.has(node.relPath);
        toggle.textContent = isExpanded ? '▼' : '▶';
        toggle.addEventListener('click', () => {
            if (expandedDirs.has(node.relPath)) expandedDirs.delete(node.relPath);
            else expandedDirs.add(node.relPath);
            saveState();
            renderTree();
        });

        const icon = document.createElement('span');
        icon.className = 'tree-icon';
        icon.textContent = '📁';

        const label = document.createElement('span');
        label.className = 'tree-label';
        label.textContent = node.name;

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.addEventListener('change', () => {
            setDirCheckedRecursive(node, cb.checked);
            renderTree();
        });

        row.appendChild(toggle);
        row.appendChild(cb);
        row.appendChild(icon);
        row.appendChild(label);
        wrapper.appendChild(row);

        if (isExpanded && node.children) {
            const childContainer = document.createElement('div');
            childContainer.className = 'tree-children';
            for (const child of node.children) {
                childContainer.appendChild(renderNode(child, depth + 1));
            }
            wrapper.appendChild(childContainer);
        }

        // 从内存 Set 计算文件夹复选框状态
        requestAnimationFrame(() => {
            const fileCount = countFiles(node.children || []);
            const checkedCount = getCheckedFileCountFromSet(node.children || []);
            if (checkedCount === 0) { cb.checked = false; cb.indeterminate = false; }
            else if (checkedCount === fileCount) { cb.checked = true; cb.indeterminate = false; }
            else { cb.checked = false; cb.indeterminate = true; }
        });

        return wrapper;
    }

    function renderFileNode(node, depth) {
        const row = document.createElement('div');
        row.className = 'tree-item';
        row.style.paddingLeft = (depth * 16 + 20) + 'px';
        row.dataset.path = node.relPath;

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = checkedPaths.has(node.relPath);
        cb.addEventListener('change', () => {
            if (cb.checked) checkedPaths.add(node.relPath);
            else checkedPaths.delete(node.relPath);
            updateSelectedCount();
            saveState();
        });

        const icon = document.createElement('span');
        icon.className = 'tree-icon';
        const ext = (node.name.split('.').pop() || '').toLowerCase();
        icon.textContent = ext === 'md' ? '📝' : '📄';

        const label = document.createElement('span');
        label.className = 'tree-label';
        label.textContent = node.name;

        row.appendChild(cb);
        row.appendChild(icon);
        row.appendChild(label);
        return row;
    }

    // 递归设置目录及其所有后代的选中状态（在内存 Set 中操作，不依赖 DOM）
    function setDirCheckedRecursive(node, checked) {
        if (node.isDir) {
            for (const child of (node.children || [])) setDirCheckedRecursive(child, checked);
        } else {
            if (checked) checkedPaths.add(node.relPath);
            else checkedPaths.delete(node.relPath);
        }
    }

    // 从内存 Set 计算文件夹下已选文件数
    function getCheckedFileCountFromSet(nodes) {
        let count = 0;
        for (const n of nodes) {
            if (n.isDir) count += getCheckedFileCountFromSet(n.children || []);
            else if (checkedPaths.has(n.relPath)) count++;
        }
        return count;
    }

    function getCheckedFiles() {
        return [...checkedPaths];
    }

    function updateSelectedCount() {
        document.getElementById('selectedCount').textContent = '已选 ' + checkedPaths.size + ' 个文件';
        saveState();
    }

    // 工具栏按钮
    document.getElementById('btnSelectAll').addEventListener('click', () => {
        collectAllFilePaths(fileTree);
        renderTree();
    });
    document.getElementById('btnDeselectAll').addEventListener('click', () => {
        checkedPaths.clear();
        renderTree();
    });
    document.getElementById('btnCollapseAll').addEventListener('click', () => {
        expandedDirs.clear(); saveState(); renderTree();
    });
    document.getElementById('btnExpandAll').addEventListener('click', () => {
        expandAll(fileTree); saveState(); renderTree();
    });
    document.getElementById('btnPickDir').addEventListener('click', () => {
        vscode.postMessage({ command: 'batchExport.pickDir' });
    });
    document.getElementById('btnExport').addEventListener('click', () => {
        const files = getCheckedFiles();
        if (files.length === 0) {
            document.getElementById('status').textContent = '请至少选择一个文件！';
            return;
        }
        vscode.postMessage({
            command: 'batchExport.execute',
            files: files,
            format: document.getElementById('format').value,
            template: document.getElementById('template').value,
            outputDir: document.getElementById('outputDir').value || undefined,
            keepStructure: document.getElementById('keepStructure').checked,
        });
    });

    function expandAll(nodes) {
        for (const n of nodes) {
            if (n.isDir) {
                expandedDirs.add(n.relPath);
                expandAll(n.children || []);
            }
        }
    }

    // 递归收集所有文件路径到 checkedPaths
    function collectAllFilePaths(nodes) {
        for (const n of nodes) {
            if (n.isDir) collectAllFilePaths(n.children || []);
            else checkedPaths.add(n.relPath);
        }
    }
})();
</script>
</body>
</html>
