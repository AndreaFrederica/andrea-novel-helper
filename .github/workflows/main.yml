name: build-vsix (std+exp)

on:
  workflow_dispatch:
    inputs:
      electron_version:
        description: "VS Code 的 Electron 版本（如 30.0.9）"
        required: true
        default: "30.0.9"
      publish:
        description: "打完是否立即发布到 Marketplace（需要 VSCE_PAT）"
        type: boolean
        required: true
        default: false
      release_only:
        description: "仅创建 GitHub Release，不推送到商店"
        type: boolean
        required: true
        default: false
      release_notes:
        description: "可选：自定义 Release 说明（留空则自动生成）"
        required: false
        default: ""
      release_notes_path:
        description: "可选：说明文件路径（如 CHANGELOG.md；留空则自动生成）"
        required: false
        default: ""

jobs:
  webview:
    name: Build webview (Quasar) once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps (workspace:webview)
        run: |
          npm ci
          npm --workspace=packages/webview run build

      - uses: actions/upload-artifact@v4
        with:
          name: webview-dist
          path: packages/webview/dist

  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            platform: win32
            arch: x64
          - os: macos-latest
            target: darwin-arm64
            platform: darwin
            arch: arm64
          - os: macos-latest
            target: darwin-x64
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    needs: webview

    env:
      # 扩展根目录；若在子目录请改成实际路径，例如 packages/extension
      WORKDIR: .
      EV: ${{ inputs.electron_version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules/
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache TypeScript compilation
        uses: actions/cache@v4
        with:
          path: |
            out/
            packages/enigo-keyboard/dist/
          key: ${{ runner.os }}-tsc-${{ hashFiles('tsconfig.json', 'packages/enigo-keyboard/tsconfig.json', 'src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-tsc-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 安装依赖
      - name: Install deps
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "No lockfile found, falling back to npm install"
            npm install --no-audit --no-fund
          fi

      - name: Download webview dist (reuse build)
        uses: actions/download-artifact@v4
        with:
          name: webview-dist
          path: packages/webview/dist

      - name: Build native enigo-keyboard
        working-directory: ${{ env.WORKDIR }}/packages/enigo-keyboard
        shell: bash
        run: |
          # Use CI-specific build script
          npm run build:ci

      # TypeScript 编译（与 vscode:prepublish 一致）
      - name: Compile extension
        working-directory: ${{ env.WORKDIR }}
        run: npm run compile

      # macOS 代码签名
      - name: Sign macOS binary
        if: runner.os == 'macOS'
        working-directory: ${{ env.WORKDIR }}/packages/enigo-keyboard
        shell: bash
        run: npm run sign:macos

      # 为目标 Electron + 平台/架构重建原生模块（跨平台统一用 bash）
      - name: Rebuild @node-rs/jieba for Electron (${{ matrix.platform }}-${{ matrix.arch }})
        if: runner.os != 'Windows' # Windows 上 @node-rs/jieba rebuild 会失败，使用预编译 NAPI 即可
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          npm rebuild @node-rs/jieba \
            --runtime=electron \
            --target='${{ inputs.electron_version }}' \
            --dist-url=https://electronjs.org/headers \
            --platform='${{ matrix.platform }}' \
            --arch='${{ matrix.arch }}'

      - name: Rebuild @vscode/sqlite3 for Electron (${{ matrix.platform }}-${{ matrix.arch }})
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          npm rebuild @vscode/sqlite3 \
            --runtime=electron \
            --target='${{ inputs.electron_version }}' \
            --dist-url=https://electronjs.org/headers \
            --platform='${{ matrix.platform }}' \
            --arch='${{ matrix.arch }}'

      - name: Package STD variant
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          node -e '
            const fs=require("fs");
            const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
            pkg.activationEvents=(pkg.activationEvents||[]).filter(x=>x!=="onStartupFinished");
            if(pkg.scripts&&pkg.scripts["vscode:prepublish"]) pkg.scripts["vscode:prepublish"]="npm run compile";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          OUT="dist/anh-std-${{ matrix.target }}.vsix"
          echo "Packaging STD to $OUT"
          npx vsce package --target ${{ matrix.target }} --out "$OUT"
          ls -al dist

      - name: Package EXP variant
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs=require("fs");
            const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
            const evs=new Set(pkg.activationEvents||[]);
            evs.add("onStartupFinished");
            pkg.activationEvents=[...evs];
            const parts=pkg.version.split(".").map(Number);
            if(parts.length!==3||parts.some(Number.isNaN)) throw new Error("Invalid semver: "+pkg.version);
            parts[2]+=1;
            pkg.version=parts.join(".");
            if(pkg.scripts&&pkg.scripts["vscode:prepublish"]) pkg.scripts["vscode:prepublish"]="npm run compile";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          OUT="dist/anh-exp-${{ matrix.target }}.vsix"
          echo "Packaging EXP (pre-release) to $OUT"
          npx vsce package --target ${{ matrix.target }} --pre-release --out "$OUT"
          ls -al dist

      # 分别上传 STD/EXP 两个 VSIX 工件
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-std.vsix
          path: ${{ env.WORKDIR }}/dist/anh-std-${{ matrix.target }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-exp.vsix
          path: ${{ env.WORKDIR }}/dist/anh-exp-${{ matrix.target }}.vsix

  build-linux:
    name: Build ${{ matrix.target }} (Linux glibc baseline)
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            platform: linux
            arch: x64
          - os: ubuntu-latest
            target: linux-arm64
            platform: linux
            arch: arm64
          - os: ubuntu-latest
            target: linux-armhf
            platform: linux
            arch: arm
    runs-on: ${{ matrix.os }}
    needs: webview
    container:
      image: debian:buster
    env:
      WORKDIR: .
      EV: ${{ inputs.electron_version }}
    steps:
      - run: |
          set -e
          echo 'deb http://archive.debian.org/debian buster main' > /etc/apt/sources.list
          echo 'deb http://archive.debian.org/debian-security buster/updates main' >> /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99disable-check-valid-until
          apt-get -o Acquire::AllowInsecureRepositories=true update
          apt-get install -y --no-install-recommends git curl python3 make g++ ca-certificates

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules/
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache TypeScript compilation
        uses: actions/cache@v4
        with:
          path: |
            out/
            packages/enigo-keyboard/dist/
          key: ${{ runner.os }}-tsc-${{ hashFiles('tsconfig.json', 'packages/enigo-keyboard/tsconfig.json', 'src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-tsc-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "No lockfile found, falling back to npm install"
            npm install --no-audit --no-fund
          fi

      - name: Download webview dist (reuse build)
        uses: actions/download-artifact@v4
        with:
          name: webview-dist
          path: packages/webview/dist

      - name: Build native enigo-keyboard
        working-directory: ${{ env.WORKDIR }}/packages/enigo-keyboard
        run: |
          # Use CI-specific build script
          npm run build:ci

      - name: Compile extension
        working-directory: ${{ env.WORKDIR }}
        run: npm run compile

      - name: Rebuild @vscode/sqlite3 for Electron (${{ matrix.platform }}-${{ matrix.arch }})
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          npm rebuild @vscode/sqlite3 \
            --runtime=electron \
            --target='${{ inputs.electron_version }}' \
            --dist-url=https://electronjs.org/headers \
            --platform='${{ matrix.platform }}' \
            --arch='${{ matrix.arch }}'

      - name: Package STD variant
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          node -e '
            const fs=require("fs");
            const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
            pkg.activationEvents=(pkg.activationEvents||[]).filter(x=>x!=="onStartupFinished");
            if(pkg.scripts&&pkg.scripts["vscode:prepublish"]) pkg.scripts["vscode:prepublish"]="npm run compile";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          OUT="dist/anh-std-${{ matrix.target }}.vsix"
          echo "Packaging STD to $OUT"
          npx vsce package --target ${{ matrix.target }} --out "$OUT"
          ls -al dist

      - name: Package EXP variant
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs=require("fs");
            const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
            const evs=new Set(pkg.activationEvents||[]);
            evs.add("onStartupFinished");
            pkg.activationEvents=[...evs];
            const parts=pkg.version.split(".").map(Number);
            if(parts.length!==3||parts.some(Number.isNaN)) throw new Error("Invalid semver: "+pkg.version);
            parts[2]+=1;
            pkg.version=parts.join(".");
            if(pkg.scripts&&pkg.scripts["vscode:prepublish"]) pkg.scripts["vscode:prepublish"]="npm run compile";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          OUT="dist/anh-exp-${{ matrix.target }}.vsix"
          echo "Packaging EXP (pre-release) to $OUT"
          npx vsce package --target ${{ matrix.target }} --pre-release --out "$OUT"
          ls -al dist

      # 分别上传 STD/EXP 两个 VSIX 工件
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-std.vsix
          path: ${{ env.WORKDIR }}/dist/anh-std-${{ matrix.target }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-exp.vsix
          path: ${{ env.WORKDIR }}/dist/anh-exp-${{ matrix.target }}.vsix

  publish:
    name: Publish to Marketplace
    needs: [build, build-linux]
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*.vsix"
          merge-multiple: true
          path: release_artifacts

      - run: npm i -g @vscode/vsce ovsx
        if: ${{ inputs.release_only != true }}

      - name: Publish to VSCode Marketplace & OpenVSX
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( release_artifacts/*.vsix )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No VSIX files found"; exit 1
          fi

          for f in "${files[@]}"; do
            if [[ "$f" == *"win32-ia32"* ]]; then
              echo "Skipping unsupported target for VSCE: $f";
              # OpenVSX 也与 VS Code 平台标识保持一致，通常不接受 ia32；统一跳过
              continue;
            fi
            if [[ "$f" == *"exp"* ]]; then
              vsce publish --packagePath "$f" --pre-release
              ovsx publish "$f" --pre-release
            else
              vsce publish --packagePath "$f"
              ovsx publish "$f"
            fi
          done
        if: ${{ inputs.release_only != true }}

      - name: Compute versions
        id: ver
        shell: bash
        run: |
          STD_VER=$(node -e 'console.log(require("./package.json").version)')
          echo "STD_VER=$STD_VER" >> "$GITHUB_ENV"
          echo "EXP_VER=$STD_VER" >> "$GITHUB_ENV"

      - name: Get latest commit message
        id: commit
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%B | sed 's/\r$//')
          echo "COMMIT_MSG<<EOF" >> $GITHUB_ENV
          echo "$MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release (combined)
        if: ${{ inputs.release_notes != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.STD_VER }}
          name: ANH v${{ env.STD_VER }}
          draft: false
          prerelease: false
          files: |
            release_artifacts/anh-std-*.vsix
            release_artifacts/anh-exp-*.vsix
          fail_on_unmatched_files: false
          body: |
            ${{ inputs.release_notes }}

            ## Variants
            - `std`: Stable build; disables `onStartupFinished` to follow VS Code activation standards; normal startup.
            - `exp`: Preview build; patch version +1; enables `onStartupFinished` to start early; marked pre-release and must be installed manually.
            - Both variants share the same features and fixes for this release; only activation timing differs.

      - name: Create GitHub Release (combined via body_path)
        if: ${{ inputs.release_notes == '' && inputs.release_notes_path != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.STD_VER }}
          name: ANH v${{ env.STD_VER }}
          draft: false
          prerelease: false
          files: |
            release_artifacts/anh-std-*.vsix
            release_artifacts/anh-exp-*.vsix
          fail_on_unmatched_files: false
          body_path: ${{ inputs.release_notes_path }}
          append_body: true
          body: |
            ## Variants
            - `std`: Stable build; disables `onStartupFinished` to follow VS Code activation standards; normal startup.
            - `exp`: Preview build; patch version +1; enables `onStartupFinished` to start early; marked pre-release and must be installed manually.
            - Both variants share the same features and fixes for this release; only activation timing differs.

      - name: Create GitHub Release (combined auto)
        if: ${{ inputs.release_notes == '' && inputs.release_notes_path == '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.STD_VER }}
          name: ANH v${{ env.STD_VER }}
          draft: false
          prerelease: false
          files: |
            release_artifacts/anh-std-*.vsix
            release_artifacts/anh-exp-*.vsix
          fail_on_unmatched_files: false
          body: |
            ${{ env.COMMIT_MSG }}

            ## Variants
            - `std`: Stable build; disables `onStartupFinished` to follow VS Code activation standards; normal startup.
            - `exp`: Preview build; patch version +1; enables `onStartupFinished` to start early; marked pre-release and must be installed manually.
            - Both variants share the same features and fixes for this release; only activation timing differs.
