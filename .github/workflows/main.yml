name: build-vsix

on:
  workflow_dispatch:
    inputs:
      electron_version:
        description: "VS Code 的 Electron 版本（如 30.0.9）"
        required: true
        default: "30.0.9"
      variant:
        description: "构建变体：exp（预发布，含 onStartupFinished）、std（稳定版）、both（两者都打包）"
        type: choice
        options:
          - exp
          - std
          - both
        default: exp
        required: true
      build_darwin_arm64:
        description: "构建 darwin-arm64（macOS Apple Silicon）"
        type: boolean
        required: true
        default: true
      build_darwin_x64:
        description: "构建 darwin-x64（macOS Intel）"
        type: boolean
        required: true
        default: false
      build_win32_x64:
        description: "构建 win32-x64（Windows x64）"
        type: boolean
        required: true
        default: true
      build_linux_x64:
        description: "构建 linux-x64"
        type: boolean
        required: true
        default: true
      build_linux_arm64:
        description: "构建 linux-arm64"
        type: boolean
        required: true
        default: true
      build_linux_armhf:
        description: "构建 linux-armhf"
        type: boolean
        required: true
        default: true
      publish:
        description: "打完是否立即发布到 Marketplace（需要 VSCE_PAT）"
        type: boolean
        required: true
        default: false
      release_only:
        description: "仅创建 GitHub Release，不推送到商店"
        type: boolean
        required: true
        default: false
      release_notes:
        description: "可选：自定义 Release 说明（留空则自动生成）"
        required: false
        default: ""
      release_notes_path:
        description: "可选：说明文件路径（如 CHANGELOG.md；留空则自动生成）"
        required: false
        default: ""
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  prepare:
    name: Prepare build matrices
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      build_count: ${{ steps.matrix.outputs.build_count }}
      linux_matrix: ${{ steps.matrix.outputs.linux_matrix }}
      linux_count: ${{ steps.matrix.outputs.linux_count }}
    steps:
      - name: Filter requested platforms
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_DARWIN_ARM64: ${{ inputs.build_darwin_arm64 }}
          BUILD_DARWIN_X64: ${{ inputs.build_darwin_x64 }}
          BUILD_WIN32_X64: ${{ inputs.build_win32_x64 }}
          BUILD_LINUX_X64: ${{ inputs.build_linux_x64 }}
          BUILD_LINUX_ARM64: ${{ inputs.build_linux_arm64 }}
          BUILD_LINUX_ARMHF: ${{ inputs.build_linux_armhf }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          desktop = [
              {
                  "os": "macos-latest",
                  "target": "darwin-arm64",
                  "platform": "darwin",
                  "arch": "arm64",
              },
              {
                  "os": "macos-13",
                  "target": "darwin-x64",
                  "platform": "darwin",
                  "arch": "x64",
              },
              {
                  "os": "windows-latest",
                  "target": "win32-x64",
                  "platform": "win32",
                  "arch": "x64",
              },
          ]
          linux = [
              {
                  "target": "linux-x64",
                  "platform": "linux",
                  "arch": "x64",
                  "build_target": "",
                  "linker_env": "",
                  "linker_value": "",
              },
              {
                  "target": "linux-arm64",
                  "platform": "linux",
                  "arch": "arm64",
                  "build_target": "aarch64-unknown-linux-gnu",
                  "linker_env": "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER",
                  "linker_value": "aarch64-linux-gnu-gcc",
              },
              {
                  "target": "linux-armhf",
                  "platform": "linux",
                  "arch": "arm",
                  "build_target": "arm-unknown-linux-gnueabihf",
                  "linker_env": "CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER",
                  "linker_value": "arm-linux-gnueabihf-gcc",
              },
          ]

          default_enabled = {
              "darwin-arm64": True,
              "darwin-x64": False,
              "win32-x64": True,
              "linux-x64": True,
              "linux-arm64": True,
              "linux-armhf": True,
          }
          input_names = {
              "darwin-arm64": "BUILD_DARWIN_ARM64",
              "darwin-x64": "BUILD_DARWIN_X64",
              "win32-x64": "BUILD_WIN32_X64",
              "linux-x64": "BUILD_LINUX_X64",
              "linux-arm64": "BUILD_LINUX_ARM64",
              "linux-armhf": "BUILD_LINUX_ARMHF",
          }

          def enabled(target):
              if os.environ.get("EVENT_NAME") != "workflow_dispatch":
                  return default_enabled[target]
              return os.environ.get(input_names[target], "").lower() == "true"

          selected_targets = {
              target for target in input_names
              if enabled(target)
          }
          if not selected_targets:
              print("At least one platform checkbox must be selected.", file=sys.stderr)
              sys.exit(1)

          def selected(items):
              return [
                  item for item in items if item["target"] in selected_targets
              ]

          build_matrix = selected(desktop)
          linux_matrix = selected(linux)
          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"build_count={len(build_matrix)}\n")
              output.write(f"linux_count={len(linux_matrix)}\n")
              output.write(
                  "build_matrix="
                  + json.dumps(
                      build_matrix
                      or [
                          {
                              "os": "ubuntu-latest",
                              "target": "skip",
                              "platform": "skip",
                              "arch": "x64",
                          }
                      ],
                      separators=(",", ":"),
                  )
                  + "\n"
              )
              output.write(
                  "linux_matrix="
                  + json.dumps(
                      linux_matrix
                      or [
                          {
                              "target": "skip",
                              "platform": "skip",
                              "arch": "x64",
                              "build_target": "",
                              "linker_env": "",
                              "linker_value": "",
                          }
                      ],
                      separators=(",", ":"),
                  )
                  + "\n"
              )
          PY

  webview:
    name: Build webview (Quasar) once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps (workspace:webview)
        run: |
          npm ci
          npm --workspace=packages/webview run build

      - uses: actions/upload-artifact@v4
        with:
          name: webview-dist
          path: packages/webview/dist

  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    needs: [prepare, webview]
    if: ${{ needs.prepare.outputs.build_count != '0' }}

    env:
      # 扩展根目录；若在子目录请改成实际路径，例如 packages/extension
      WORKDIR: .
      EV: ${{ inputs.electron_version || '30.0.9' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/enigo-keyboard/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('packages/enigo-keyboard/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Cache TypeScript compilation
        uses: actions/cache@v4
        with:
          path: |
            out/
            packages/enigo-keyboard/dist/
          key: ${{ runner.os }}-tsc-${{ hashFiles('tsconfig.json', 'packages/enigo-keyboard/tsconfig.json', 'src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-tsc-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 安装依赖
      - name: Install deps
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        env:
          # 让 npm 以目标架构安装依赖（影响 @node-rs/jieba 等预编译包）
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          npm_config_platform: ${{ matrix.platform }}
        run: npm ci

      - name: Download webview dist (reuse build)
        uses: actions/download-artifact@v4
        with:
          name: webview-dist
          path: packages/webview/dist

      - name: Build native enigo-keyboard
        working-directory: ${{ env.WORKDIR }}/packages/enigo-keyboard
        shell: bash
        run: |
          # Use CI-specific build script
          npm run build:ci

      # TypeScript 编译（与 vscode:prepublish 一致）
      - name: Compile extension
        working-directory: ${{ env.WORKDIR }}
        run: npm run compile

      # macOS 代码签名
      - name: Sign macOS binary
        if: runner.os == 'macOS'
        working-directory: ${{ env.WORKDIR }}/packages/enigo-keyboard
        shell: bash
        run: npm run sign:macos

      # 为目标 Electron + 平台/架构重建原生模块（跨平台统一用 bash）
      - name: Rebuild @vscode/sqlite3 for Electron (${{ matrix.platform }}-${{ matrix.arch }})
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          npm_config_platform: ${{ matrix.platform }}
        run: |
          npm rebuild @vscode/sqlite3 \
            --runtime=electron \
            --target='${{ inputs.electron_version }}' \
            --dist-url=https://electronjs.org/headers \
            --platform='${{ matrix.platform }}' \
            --arch='${{ matrix.arch }}'

      - name: Package STD variant
        if: inputs.variant == 'std' || inputs.variant == 'both'
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          node -e '
            const fs=require("fs");
            const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
            pkg.activationEvents=(pkg.activationEvents||[]).filter(x=>x!=="onStartupFinished");
            if(pkg.scripts&&pkg.scripts["vscode:prepublish"]) pkg.scripts["vscode:prepublish"]="npm run compile";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          OUT="dist/anh-std-${{ matrix.target }}.vsix"
          echo "Packaging STD to $OUT"
          npx vsce package --target ${{ matrix.target }} --out "$OUT"
          ls -al dist

      - name: Package EXP variant
        if: inputs.variant == 'exp' || inputs.variant == 'both'
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          node -e '
            const fs=require("fs");
            const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
            const evs=new Set(pkg.activationEvents||[]);
            evs.add("onStartupFinished");
            pkg.activationEvents=[...evs];
            // 仅双版本构建时才 +1，单版本构建保持原版本号
            const both = "${{ inputs.variant }}" === "both";
            if (both) {
              const parts=pkg.version.split(".").map(Number);
              if(parts.length!==3||parts.some(Number.isNaN)) throw new Error("Invalid semver: "+pkg.version);
              parts[2]+=1;
              pkg.version=parts.join(".");
            }
            if(pkg.scripts&&pkg.scripts["vscode:prepublish"]) pkg.scripts["vscode:prepublish"]="npm run compile";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          OUT="dist/anh-exp-${{ matrix.target }}.vsix"
          echo "Packaging EXP (pre-release) to $OUT"
          npx vsce package --target ${{ matrix.target }} --pre-release --out "$OUT"
          ls -al dist

      # 分别上传 STD/EXP 两个 VSIX 工件
      - uses: actions/upload-artifact@v4
        if: inputs.variant == 'std' || inputs.variant == 'both'
        with:
          name: ${{ matrix.target }}-std.vsix
          path: ${{ env.WORKDIR }}/dist/anh-std-${{ matrix.target }}.vsix

      - uses: actions/upload-artifact@v4
        if: inputs.variant == 'exp' || inputs.variant == 'both'
        with:
          name: ${{ matrix.target }}-exp.vsix
          path: ${{ env.WORKDIR }}/dist/anh-exp-${{ matrix.target }}.vsix

  build-linux:
    name: Build ${{ matrix.target }} (Linux glibc baseline)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.linux_matrix) }}

    runs-on: ubuntu-latest
    needs: [prepare, webview]
    if: ${{ needs.prepare.outputs.linux_count != '0' }}

    container:
      image: debian:bookworm

    defaults:
      run:
        shell: bash

    env:
      WORKDIR: .
      EV: ${{ inputs.electron_version || '30.0.9' }}

    steps:
      - name: Install OS deps
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl python3 make g++ ca-certificates pkg-config bash

          if [ '${{ matrix.arch }}' = 'arm64' ]; then
            apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          elif [ '${{ matrix.arch }}' = 'arm' ]; then
            apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/enigo-keyboard/target
          key: linux-bookworm-${{ matrix.target }}-cargo-${{ hashFiles('packages/enigo-keyboard/Cargo.lock') }}
          restore-keys: |
            linux-bookworm-${{ matrix.target }}-cargo-

      - name: Cache TypeScript compilation
        uses: actions/cache@v4
        with:
          path: |
            out/
            packages/enigo-keyboard/dist/
          key: ${{ runner.os }}-tsc-${{ hashFiles('tsconfig.json', 'packages/enigo-keyboard/tsconfig.json', 'src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-tsc-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust cross targets
        if: matrix.build_target != ''
        run: rustup target add '${{ matrix.build_target }}'

      - name: Install deps
        run: |
          set -e
          python3 --version
          node -v
          npm -v
          npm_config_python="$(command -v python3)" npm ci

      - name: Download webview dist (reuse build)
        uses: actions/download-artifact@v4
        with:
          name: webview-dist
          path: packages/webview/dist

      - name: Build native enigo-keyboard
        working-directory: ${{ env.WORKDIR }}/packages/enigo-keyboard
        env:
          BUILD_TARGET: ${{ matrix.build_target }}
          LINKER_ENV: ${{ matrix.linker_env }}
          LINKER_VALUE: ${{ matrix.linker_value }}
        run: |
          if [ -n "$LINKER_ENV" ]; then
            export "$LINKER_ENV=$LINKER_VALUE"
          fi
          # Use CI-specific build script (supports BUILD_TARGET for cross)
          npm run build:ci

      - name: Compile extension
        working-directory: ${{ env.WORKDIR }}
        run: npm run compile

      - name: Rebuild @vscode/sqlite3 for Electron (${{ matrix.platform }}-${{ matrix.arch }})
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          npm rebuild @vscode/sqlite3 \
            --runtime=electron \
            --target='${{ inputs.electron_version }}' \
            --dist-url=https://electronjs.org/headers \
            --platform='${{ matrix.platform }}' \
            --arch='${{ matrix.arch }}'

      - name: Package STD variant
        if: inputs.variant == 'std' || inputs.variant == 'both'
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          node -e '
            const fs=require("fs");
            const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
            pkg.activationEvents=(pkg.activationEvents||[]).filter(x=>x!=="onStartupFinished");
            if(pkg.scripts&&pkg.scripts["vscode:prepublish"]) pkg.scripts["vscode:prepublish"]="npm run compile";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          OUT="dist/anh-std-${{ matrix.target }}.vsix"
          echo "Packaging STD to $OUT"
          npx vsce package --target ${{ matrix.target }} --out "$OUT"
          ls -al dist

      - name: Package EXP variant
        if: inputs.variant == 'exp' || inputs.variant == 'both'
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          node -e '
            const fs=require("fs");
            const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
            const evs=new Set(pkg.activationEvents||[]);
            evs.add("onStartupFinished");
            pkg.activationEvents=[...evs];
            // 仅双版本构建时才 +1，单版本构建保持原版本号
            const both = "${{ inputs.variant }}" === "both";
            if (both) {
              const parts=pkg.version.split(".").map(Number);
              if(parts.length!==3||parts.some(Number.isNaN)) throw new Error("Invalid semver: "+pkg.version);
              parts[2]+=1;
              pkg.version=parts.join(".");
            }
            if(pkg.scripts&&pkg.scripts["vscode:prepublish"]) pkg.scripts["vscode:prepublish"]="npm run compile";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          OUT="dist/anh-exp-${{ matrix.target }}.vsix"
          echo "Packaging EXP (pre-release) to $OUT"
          npx vsce package --target ${{ matrix.target }} --pre-release --out "$OUT"
          ls -al dist

      # 分别上传 STD/EXP 两个 VSIX 工件
      - uses: actions/upload-artifact@v4
        if: inputs.variant == 'std' || inputs.variant == 'both'
        with:
          name: ${{ matrix.target }}-std.vsix
          path: ${{ env.WORKDIR }}/dist/anh-std-${{ matrix.target }}.vsix

      - uses: actions/upload-artifact@v4
        if: inputs.variant == 'exp' || inputs.variant == 'both'
        with:
          name: ${{ matrix.target }}-exp.vsix
          path: ${{ env.WORKDIR }}/dist/anh-exp-${{ matrix.target }}.vsix

  publish:
    name: Publish to Marketplace
    needs: [prepare, build, build-linux]
    if: ${{ always() && (inputs.publish == true || github.event_name == 'push' && github.ref_type == 'tag') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*.vsix"
          merge-multiple: true
          path: release_artifacts

      - run: npm i -g @vscode/vsce ovsx
        if: ${{ inputs.release_only != true }}

      - name: Publish to VSCode Marketplace & OpenVSX
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( release_artifacts/*.vsix )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No VSIX files found"; exit 1
          fi

          for f in "${files[@]}"; do
            if [[ "$f" == *"win32-ia32"* ]]; then
              echo "Skipping unsupported target for VSCE: $f";
              # OpenVSX 也与 VS Code 平台标识保持一致，通常不接受 ia32；统一跳过
              continue;
            fi
            if [[ "$f" == *"exp"* ]]; then
              vsce publish --packagePath "$f" --pre-release
              ovsx publish "$f" --pre-release
            else
              vsce publish --packagePath "$f"
              ovsx publish "$f"
            fi
          done
        if: ${{ inputs.release_only != true }}

      - name: Compute versions
        id: ver
        shell: bash
        run: |
          STD_VER=$(node -e 'console.log(require("./package.json").version)')
          echo "STD_VER=$STD_VER" >> "$GITHUB_ENV"
          echo "EXP_VER=$STD_VER" >> "$GITHUB_ENV"

      - name: Get latest commit message
        id: commit
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%B | sed 's/\r$//')
          echo "COMMIT_MSG<<EOF" >> $GITHUB_ENV
          echo "$MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release (combined)
        if: ${{ inputs.release_notes != '' && github.event_name != 'push' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.STD_VER }}
          name: ANH v${{ env.STD_VER }}
          draft: false
          prerelease: false
          files: |
            release_artifacts/anh-std-*.vsix
            release_artifacts/anh-exp-*.vsix
          fail_on_unmatched_files: false
          body: |
            ${{ inputs.release_notes }}

            ## Variants
            - `std`: Stable build; disables `onStartupFinished` to follow VS Code activation standards; normal startup.
            - `exp`: Preview build; enables `onStartupFinished` to start early; marked pre-release and must be installed manually. Single-variant builds keep the base version, while `both` builds use patch version +1 for `exp`.
            - Both variants share the same features and fixes for this release; only activation timing differs.

      - name: Create GitHub Release (combined via body_path)
        if: ${{ inputs.release_notes == '' && inputs.release_notes_path != '' && github.event_name != 'push' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.STD_VER }}
          name: ANH v${{ env.STD_VER }}
          draft: false
          prerelease: false
          files: |
            release_artifacts/anh-std-*.vsix
            release_artifacts/anh-exp-*.vsix
          fail_on_unmatched_files: false
          body_path: ${{ inputs.release_notes_path }}
          append_body: true
          body: |
            ## Variants
            - `std`: Stable build; disables `onStartupFinished` to follow VS Code activation standards; normal startup.
            - `exp`: Preview build; enables `onStartupFinished` to start early; marked pre-release and must be installed manually. Single-variant builds keep the base version, while `both` builds use patch version +1 for `exp`.
            - Both variants share the same features and fixes for this release; only activation timing differs.

      - name: Create GitHub Release (combined auto)
        if: ${{ inputs.release_notes == '' && inputs.release_notes_path == '' || github.event_name == 'push' && github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.STD_VER }}
          name: ANH v${{ env.STD_VER }}
          draft: false
          prerelease: false
          files: |
            release_artifacts/anh-std-*.vsix
            release_artifacts/anh-exp-*.vsix
          fail_on_unmatched_files: false
          body: |
            ${{ env.COMMIT_MSG }}

            ## Variants
            - `std`: Stable build; disables `onStartupFinished` to follow VS Code activation standards; normal startup.
            - `exp`: Preview build; enables `onStartupFinished` to start early; marked pre-release and must be installed manually. Single-variant builds keep the base version, while `both` builds use patch version +1 for `exp`.
            - Both variants share the same features and fixes for this release; only activation timing differs.
